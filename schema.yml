components:
  schemas:
    Author:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 160
        biography:
          type: string
        avatar:
          type: string
          format: uri
          nullable: true
      required:
      - id
      - name
    Book:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        author:
          type: string
          maxLength: 160
        author_record:
          type: integer
          nullable: true
        author_name:
          type: string
          readOnly: true
        description:
          type: string
        genre:
          type: string
          maxLength: 80
        category:
          type: integer
          nullable: true
        category_name:
          type: string
          readOnly: true
        publication_year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        published_year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        language:
          type: string
          maxLength: 64
        pages:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        isbn:
          type: string
          nullable: true
          maxLength: 32
        publisher:
          type: string
          maxLength: 160
        rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
        cover:
          type: string
          format: uri
          nullable: true
        cover_url:
          type: string
          readOnly: true
        book_file:
          type: string
          format: uri
          nullable: true
        audio_book:
          type: string
          format: uri
          nullable: true
        files:
          type: array
          items:
            $ref: '#/components/schemas/BookFile'
          readOnly: true
        is_available:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_favorite:
          type: string
          readOnly: true
      required:
      - author
      - author_name
      - category_name
      - cover_url
      - created_at
      - files
      - id
      - is_favorite
      - title
    BookFile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        file:
          type: string
          format: uri
        file_type:
          $ref: '#/components/schemas/FileTypeEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        book:
          type: integer
          readOnly: true
      required:
      - book
      - created_at
      - file
      - file_type
      - id
    BookGame:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        group:
          type: integer
        book:
          allOf:
          - $ref: '#/components/schemas/Book'
          readOnly: true
        started_by:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/BookGameStatusEnum'
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        participants:
          type: array
          items:
            $ref: '#/components/schemas/GameParticipant'
          readOnly: true
      required:
      - book
      - created_at
