services:
  backend:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DB_PATH: /app/data/db.sqlite3
    volumes:
      - ./media:/app/media
      - ./runtime/staticfiles:/app/staticfiles
      - ./runtime/data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./archive-web
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - ./runtime/redis:/data
    restart: unless-stopped
